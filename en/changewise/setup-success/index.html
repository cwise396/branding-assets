<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>Setup saved – ChangeWise</title>

  <link rel="canonical" href="https://slackdigest.org/en/changewise/setup-success/">

  <style>
    :root{
      --bg:rgb(16,57,96);
      --card:#F3F6FA;
      --cardText:#0E3960;
      --btn:rgb(21,63,108);
      --btnText:#FFFFFF;
      --shadow:0 10px 30px rgba(0,0,0,.15);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:24px;

      background:var(--bg);

      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
    }

    .page{
      width:100%;

      display:flex;
      flex-direction:column;

      align-items:center;
    }

    .card{
      width:100%;
      max-width:620px;

      background:var(--card);
      color:var(--cardText);

      border-radius:22px;

      padding:40px 34px;

      box-shadow:var(--shadow);

      text-align:center;
    }

    h1{
      margin:0 0 12px;

      font-size:34px;
      line-height:1.08;

      font-weight:900;

      letter-spacing:-.4px;

      color:var(--cardText);
    }

    .sub{
      margin:0 auto 26px;

      max-width:520px;

      font-size:16px;
      line-height:1.65;

      color:var(--cardText);

      opacity:.88;
    }

    .status{
      display:inline-block;

      margin-bottom:22px;

      padding:7px 12px;

      border-radius:999px;

      background:rgba(21,63,108,.10);

      color:rgb(21,63,108);

      font-size:13px;
      font-weight:900;

      letter-spacing:.02em;
    }

    .micro{
      margin-top:24px;

      font-size:14px;
      font-weight:600;

      line-height:1.5;

      opacity:.78;
    }

    .footer-links{
      margin-top:22px;

      display:flex;
      justify-content:center;

      gap:18px;

      font-size:14px;
    }

    .footer-links a{
      color:#FFFFFF;

      text-decoration:none;

      opacity:.78;
    }

    .footer-links a:hover{
      opacity:1;
    }

    @media (max-width:720px){

      .card{
        padding:32px 24px;
      }

      h1{
        font-size:28px;
      }

    }

  </style>
</head>

<body>

<div class="page">

  <main class="card">

    <div class="status">
      Setup saved
    </div>

    <h1>ChangeWise is ready</h1>

    <p class="sub">
  Your setup has been saved.
  The first decision recommendation will be generated from your settings.
</p>

    <div class="micro">
  All settings can be adjusted at any time.
</div>
  </main>

  <footer class="footer-links">
    <a href="/en/imprint/">Imprint</a>
    <a href="/en/privacy/">Privacy</a>
  </footer>

</div>

</body>
</html>
