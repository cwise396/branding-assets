<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>SlackDigest Setup</title>

  <link rel="canonical" href="https://slackdigest.org/en/slackdigest/setup/">

  <style>
    :root{
      --bg:#0C6C48;
      --text:#FFFFFF;

      --card:#FFFFFF;
      --cardText:#0E3960;

      --line:rgba(17,24,39,.10);
      --input:#F3F6F9;

      --btn:#0C6C48;
      --btnText:#FFFFFF;

      --shadow:0 10px 30px rgba(0,0,0,.15);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.55;
    }

    .page{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .wrap{
      width:100%;
      max-width:820px;
      margin:0 auto;
      padding:56px 18px 88px;
    }

    .card{
      background:var(--card);
      color:var(--cardText);
      border-radius:18px;
      padding:24px 22px;
      margin:18px 0;
      box-shadow:var(--shadow);
    }

    h1{
      margin:0 0 8px;
      font-size:30px;
      font-weight:900;
      letter-spacing:-.3px;
      color:var(--cardText);
    }

    h2{
      margin:0 0 10px;
      font-size:20px;
      letter-spacing:-.2px;
      color:var(--cardText);
    }

    p{
      margin:8px 0;
      color:var(--cardText);
      opacity:.88;
    }

    label{
      display:block;
      margin:14px 0 6px;
      color:var(--cardText);
      opacity:.82;
      font-size:13px;
      font-weight:700;
    }

    input,
    select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--input);
      color:var(--cardText);
      font-size:15px;
    }

    input::placeholder{
      color:#7B93AE;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:13px 16px;
      border-radius:14px;
      background:var(--btn);
      color:var(--btnText);
      text-decoration:none;
      font-weight:800;
      border:0;
      cursor:pointer;
      transition:opacity .18s ease, transform .18s ease;
    }

    .btn:hover{
      opacity:.94;
      transform:translateY(-1px);
    }

    .lead{
      font-size:15px;
      line-height:1.55;
    }

    .lead strong{
      color:var(--cardText);
      opacity:1;
    }

    .fine{
      margin-top:12px;
      font-size:13px;
      color:var(--cardText);
      opacity:.72;
    }

    .fine-strong{
      font-size:14px;
      font-weight:800;
      opacity:.92;
    }

    .footer-links{
      margin-top:-56px;
      margin-bottom:34px;
      display:flex;
      justify-content:center;
      gap:18px;
      font-size:14px;
    }

    .footer-links a{
      color:#FFFFFF !important;
      text-decoration:none;
      opacity:.86;
    }

    .footer-links a:hover{
      opacity:1;
    }

    @media(max-width:720px){
      .row{grid-template-columns:1fr}
      .wrap{padding:34px 14px 72px}
      h1{font-size:26px}
    }
  </style>
</head>

<body>

<div class="page">

  <main class="wrap">

    <section class="card">

      <h1>SlackDigest is active</h1>

      <p class="lead">
        Next, briefly define
        <strong>what</strong> we bundle —
        and <strong>where</strong> we deliver it.
      </p>

    </section>

    <section class="card">

      <h2>Configure digest</h2>

      <form action="https://formspree.io/f/xgooowpk" method="POST">

        <input type="hidden" name="product" value="slackdigest">
        <input type="hidden" name="lang" value="en">

        <input
          type="hidden"
          name="_next"
          value="https://slackdigest.org/en/slackdigest/setup-success/index.html"
        >

        <label>Email for delivery or confirmation</label>

        <input
          name="email"
          type="email"
          required
          placeholder="you@company.com"
        >

        <div class="row">

          <div>
            <label>Cadence</label>

            <select name="cadence" required>
              <option value="daily">daily</option>
              <option value="weekly">weekly</option>
            </select>
          </div>

          <div>
            <label>Delivery</label>

            <select name="delivery" required>
              <option value="email">Email</option>
              <option value="slack">Slack</option>
            </select>
          </div>

        </div>

        <label>Channels, comma-separated</label>

        <input
          name="channels"
          type="text"
          required
          placeholder="#support, #sales, #product"
        >

        <div style="margin-top:18px;">
          <button class="btn" type="submit">
            Save setup
          </button>
        </div>

        <div class="fine fine-strong">
          Changes can be adjusted at any time.
        </div>

      </form>

    </section>

  </main>

  <footer class="footer-links">
    <a href="/en/imprint/">Imprint</a>
    <a href="/en/privacy/">Privacy</a>
  </footer>

</div>

</body>
</html>
