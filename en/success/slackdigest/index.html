<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>Payment successful – SlackDigest</title>

  <link rel="canonical" href="https://slackdigest.org/en/success/slackdigest/">

  <style>
    :root{
      --bg:#0C6C48;

      --card:#FFFFFF;
      --cardText:#0E3960;

      --btn:#0C6C48;
      --btnText:#FFFFFF;

      --shadow:0 10px 30px rgba(0,0,0,.15);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:24px;

      background:var(--bg);

      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
    }

    .card{
      width:100%;
      max-width:620px;

      background:var(--card);
      color:var(--cardText);

      border-radius:22px;

      padding:40px 34px;

      box-shadow:var(--shadow);

      text-align:center;
    }

    h1{
      margin:0 0 12px;

      font-size:34px;
      line-height:1.08;

      font-weight:900;
      letter-spacing:-.4px;

      color:var(--cardText);
    }

    .sub{
      margin:0 auto 26px;

      max-width:520px;

      font-size:16px;
      line-height:1.65;

      color:var(--cardText);

      opacity:.88;
    }

    .status{
      display:inline-block;

      margin-bottom:22px;

      padding:7px 12px;

      border-radius:999px;

      background:rgba(12,108,72,.10);

      color:#0C6C48;

      font-size:13px;
      font-weight:900;
      letter-spacing:.02em;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:14px 18px;

      border-radius:14px;

      background:var(--btn);
      color:var(--btnText);

      text-decoration:none;

      font-weight:900;

      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .btn:hover{
      opacity:.94;
      transform:translateY(-1px);
    }

    .micro{
      margin-top:22px;

      font-size:13px;

      opacity:.64;
    }

    @media (max-width:720px){

      .card{
        padding:32px 24px;
      }

      h1{
        font-size:28px;
      }

    }

  </style>
</head>

<body>

  <main class="card">

    <div class="status">
      Payment successful
    </div>

    <h1>SlackDigest is ready</h1>

    <p class="sub">
      Continue with the setup to define
      channels, cadence and delivery.
    </p>

    <a class="btn" href="/en/slackdigest/setup/">
      Continue to setup
    </a>

    <div class="micro">
      Everything can be adjusted later.
    </div>

  </main>

</body>
</html>
