<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>Setup gespeichert – SlackDigest</title>

  <link rel="canonical" href="https://slackdigest.org/slackdigest/setup-success/">

  <style>
    :root{
      --bg:#0C6C48;
      --card:#FFFFFF;
      --cardText:#0E3960;
      --shadow:0 10px 30px rgba(0,0,0,.15);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:24px;

      background:var(--bg);

      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
    }

    .page{
      width:100%;

      display:flex;
      flex-direction:column;

      align-items:center;
    }

    .card{
      width:100%;
      max-width:620px;

      background:var(--card);
      color:var(--cardText);

      border-radius:22px;

      padding:40px 34px;

      box-shadow:var(--shadow);

      text-align:center;
    }

    .status{
      display:inline-block;

      margin-bottom:22px;

      padding:7px 12px;

      border-radius:999px;

      background:rgba(12,108,72,.10);

      color:#0C6C48;

      font-size:13px;
      font-weight:900;

      letter-spacing:.02em;
    }

    h1{
      margin:0 0 12px;

      font-size:34px;
      line-height:1.08;

      font-weight:900;

      letter-spacing:-.4px;
    }

    .sub{
      margin:0 auto 26px;

      max-width:520px;

      font-size:16px;
      line-height:1.65;

      opacity:.88;
    }

    .micro{
      margin-top:24px;

      font-size:14px;
      font-weight:600;

      line-height:1.5;

      opacity:.78;
    }

    .footer-links{
      margin-top:22px;

      display:flex;
      justify-content:center;

      gap:18px;

      font-size:14px;
    }

    .footer-links a{
      color:#FFFFFF;

      text-decoration:none;

      opacity:.78;
    }

    .footer-links a:hover{
      opacity:1;
    }

    @media(max-width:720px){

      .card{
        padding:32px 24px;
      }

      h1{
        font-size:28px;
      }

    }

  </style>
</head>

<body>

<div class="page">

  <main class="card">

    <div class="status">
      Setup gespeichert
    </div>

    <h1>SlackDigest ist bereit</h1>

    <p class="sub">
       
      Du erhältst deinen ersten Digest zum gewählten Takt.
    </p>

    </main>

  <footer class="footer-links">
    <a href="/impressum.html">Impressum</a>
    <a href="/datenschutz.html">Datenschutz</a>
  </footer>

</div>

</body>
</html>
