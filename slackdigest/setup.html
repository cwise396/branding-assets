<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SlackDigest ist aktiv</title>

  <style>
    :root{
      --bg:#0C6C48;
      --text:#FFFFFF;
      --card:#FFFFFF;
      --cardText:#0E3960;
      --line:rgba(17,24,39,.10);
      --input:#F3F6F9;
      --btn:#0C6C48;
      --btnText:#FFFFFF;
      --shadow:0 10px 30px rgba(0,0,0,.15);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.55;
    }

    .wrap{
      max-width:820px;
      margin:0 auto;
      padding:56px 18px 88px;
    }

    .card{
      background:var(--card);
      color:var(--cardText);
      border-radius:18px;
      padding:24px 22px;
      margin:18px 0;
      box-shadow:var(--shadow);
    }

    h1{
      margin:0 0 8px;
      font-size:30px;
      font-weight:900;
      letter-spacing:-.3px;
      color:var(--cardText);
    }

    h2{
      margin:0 0 10px;
      font-size:20px;
      letter-spacing:-.2px;
      color:var(--cardText);
    }

    p{
      margin:8px 0;
      color:var(--cardText);
      opacity:.88;
    }

    label{
      display:block;
      margin:14px 0 6px;
      color:var(--cardText);
      opacity:.82;
      font-size:13px;
      font-weight:700;
    }

    input,
    select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--input);
      color:var(--cardText);
      font-size:15px;
    }

    input::placeholder{
      color:#7B93AE;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    @media(max-width:720px){
      .row{grid-template-columns:1fr}
      .wrap{padding:34px 14px 72px}
      h1{font-size:26px}
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:13px 16px;
      border-radius:14px;
      background:var(--btn);
      color:var(--btnText);
      text-decoration:none;
      font-weight:800;
      border:0;
      cursor:pointer;
      transition:opacity .18s ease, transform .18s ease;
    }

    .btn:hover{
      opacity:.94;
      transform:translateY(-1px);
    }

    .fine{
      margin-top:12px;
      font-size:13px;
      color:var(--cardText);
      opacity:.72;
    }

    .lead{
      font-size:15px;
      line-height:1.55;
    }

    .lead strong{
      color:var(--cardText);
      opacity:1;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <section class="card">
      <h1>SlackDigest ist aktiv</h1>

      <p class="lead">
        Als Nächstes stellst du kurz ein,
        <strong>was</strong> wir bündeln —
        und <strong>wohin</strong> wir liefern.
      </p>

      <p class="fine">
        Jederzeit flexibel anpassbar.
      </p>
    </section>

    <section class="card">
      <h2>Digest einstellen</h2>

      <form action="https://formspree.io/f/xgooowpk" method="POST">
        <input type="hidden" name="product" value="slackdigest">
        <input type="hidden" name="lang" value="de">

        <label>E-Mail für Zustellung (oder Bestätigung)</label>
        <input name="email" type="email" required placeholder="du@firma.de">

        <div class="row">
          <div>
            <label>Takt</label>
            <select name="cadence" required>
              <option value="daily">täglich</option>
              <option value="weekly">wöchentlich</option>
            </select>
          </div>

          <div>
            <label>Zustellung</label>
            <select name="delivery" required>
              <option value="email">E-Mail</option>
              <option value="slack">Slack</option>
            </select>
          </div>
        </div>

        <label>Kanäle (Komma-separiert)</label>
        <input name="channels" type="text" required placeholder="#support, #sales, #product">

        <div style="margin-top:18px;">
          <button class="btn" type="submit">
            Speichern & ersten Digest starten
          </button>
        </div>

        <div class="fine">
          Du erhältst den ersten Digest zum nächsten Takt.
        </div>
      </form>
    </section>

  </main>

</body>
</html>
