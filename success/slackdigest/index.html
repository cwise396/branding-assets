<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>Zahlung erfolgreich – SlackDigest</title>

  <style>

    :root{
      --bg:#0C6C48;

      --card:#FFFFFF;
      --cardText:#0E3960;

      --btn:#0C6C48;
      --btnText:#FFFFFF;

      --shadow:0 10px 30px rgba(0,0,0,.15);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:24px;

      background:var(--bg);

      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
    }

    .card{
      width:100%;
      max-width:560px;

      background:var(--card);
      color:var(--cardText);

      border-radius:20px;

      padding:34px 30px;

      text-align:center;

      box-shadow:var(--shadow);
    }

    h1{
      margin:0 0 12px;

      font-size:32px;
      line-height:1.1;

      font-weight:900;
      letter-spacing:-.3px;

      color:var(--cardText);
    }

    p{
      margin:0;

      font-size:16px;
      line-height:1.6;

      color:var(--cardText);

      opacity:.88;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      margin-top:28px;

      padding:14px 18px;

      border-radius:14px;

      background:var(--btn);
      color:var(--btnText);

      text-decoration:none;

      font-weight:800;

      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .btn:hover{
      opacity:.94;
      transform:translateY(-1px);
    }

    .micro{
      margin-top:18px;

      font-size:13px;

      opacity:.62;
    }

    @media (max-width:640px){

      .card{
        padding:28px 22px;
      }

      h1{
        font-size:28px;
      }

    }

  </style>
</head>

<body>

  <main class="card">

    <h1>Zahlung erfolgreich</h1>

    <p>
      SlackDigest ist jetzt bereit.
    </p>

    <a class="btn" href="/slackdigest/setup.html">
      Weiter zum Setup
    </a>

    <div class="micro">
      Kanäle, Zustellung und Takt lassen sich jederzeit anpassen.
    </div>

  </main>

</body>
</html>
